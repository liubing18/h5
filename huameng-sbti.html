<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>你是哪种造梦人体质</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: #08080f;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
    animation: fadeIn 0.45s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
  }
  .screen.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-2deg); }
    50% { transform: translateY(-16px) rotate(2deg); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

  /* ====== 开场背景 ====== */
  .bg-start {
    position: fixed; inset: 0; z-index: 0;
    background: #0a0612;
    background-image:
      radial-gradient(ellipse at 15% 50%, rgba(255,106,77,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 50%, rgba(147,51,234,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 0%, rgba(251,191,36,0.08) 0%, transparent 50%);
  }
  .bg-start::after {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  /* ====== 封面 ====== */
  #screen-start { z-index: 1; gap: 0; padding: 0; justify-content: center; }

  .cover-top-badge {
    background: linear-gradient(90deg, #FF6A4D, #FF3DAA, #9333EA);
    padding: 8px 28px;
    border-radius: 50px;
    font-size: 12px; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    color: white; margin-bottom: 24px;
    box-shadow: 0 4px 24px rgba(255,107,77,0.4);
    animation: pulse 2s infinite;
  }

  .cover-icon {
    font-size: 80px; margin-bottom: 12px;
    animation: float 3.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 24px rgba(147,51,234,0.4));
  }

  .cover-main-title {
    font-size: clamp(30px, 9vw, 46px);
    font-weight: 900;
    text-align: center;
    line-height: 1.25;
    background: linear-gradient(135deg, #FF6A4D 0%, #FF3DAA 40%, #9333EA 80%, #FF6A4D 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 4s linear infinite;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .cover-sub-title {
    font-size: 14px; color: rgba(255,255,255,0.4);
    text-align: center; margin-bottom: 28px; letter-spacing: 2px;
  }

  .cover-divider {
    width: 60px; height: 3px;
    background: linear-gradient(90deg, #FF6A4D, #9333EA);
    border-radius: 2px; margin-bottom: 28px;
  }

  .cover-chips {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; max-width: 340px; margin-bottom: 40px;
    padding: 0 20px;
  }
  .chip {
    padding: 7px 18px; border-radius: 50px;
    font-size: 13px; font-weight: 700;
    border: 2px solid; letter-spacing: 0.5px;
    backdrop-filter: blur(8px);
  }

  .cover-start-btn {
    background: linear-gradient(90deg, #FF6A4D, #FF3DAA);
    border: none; color: white;
    padding: 17px 60px;
    border-radius: 60px;
    font-size: 18px; font-weight: 900;
    cursor: pointer; transition: all 0.3s;
    letter-spacing: 3px; text-transform: uppercase;
    box-shadow: 0 8px 32px rgba(255,107,77,0.4);
    margin-bottom: 16px;
  }
  .cover-start-btn:hover { transform: scale(1.07); box-shadow: 0 14px 40px rgba(255,107,77,0.6); }
  .cover-start-btn:active { transform: scale(0.97); }

  .cover-note { font-size: 12px; color: rgba(255,255,255,0.2); letter-spacing: 1px; }

  /* ====== 问题页 ====== */
  #screen-question { justify-content: flex-start; padding-top: 0; padding-bottom: 40px; }

  .q-header {
    width: 100%; padding: 20px 20px 0;
  }
  .q-progress-wrap { display: flex; align-items: center; gap: 10px; }
  .q-progress-bg { flex: 1; height: 5px; background: rgba(255,255,255,0.07); border-radius: 5px; overflow: hidden; }
  .q-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #FF6A4D, #FF3DAA, #9333EA);
    background-size: 200% 100%;
    animation: rainbow 3s linear infinite;
    border-radius: 5px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .q-progress-label { font-size: 11px; color: rgba(255,255,255,0.3); font-weight: 700; letter-spacing: 1px; white-space: nowrap; }

  .q-card {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 28px 24px; gap: 8px;
    width: 100%;
  }
  .q-number {
    font-size: 11px; color: #FF6A4D; font-weight: 900;
    letter-spacing: 5px; text-transform: uppercase; margin-bottom: 6px;
  }
  .q-text {
    font-size: clamp(18px, 5.5vw, 22px);
    font-weight: 900; text-align: center;
    line-height: 1.65; margin-bottom: 4px;
    color: #fff;
  }
  .q-hint {
    font-size: 12px; color: rgba(255,255,255,0.28);
    text-align: center; margin-bottom: 12px;
    font-style: italic;
  }

  .q-options { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; }
  .q-opt {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 15px 18px;
    cursor: pointer; transition: all 0.22s;
    display: flex; align-items: center; gap: 14px;
    animation: slideUp 0.3s ease;
    position: relative; overflow: hidden;
  }
  .q-opt::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #FF6A4D, #FF3DAA);
    opacity: 0; transition: opacity 0.2s;
    border-radius: 0 2px 2px 0;
  }
  .q-opt:hover {
    background: rgba(255,107,77,0.1);
    border-color: rgba(255,107,77,0.5);
    transform: translateX(5px);
  }
  .q-opt:hover::before { opacity: 1; }
  .q-opt:active { transform: scale(0.97); }

  .opt-num {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(147,51,234,0.15);
    border: 1.5px solid rgba(147,51,234,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900;
    color: #a855f7; flex-shrink: 0; transition: all 0.2s;
  }
  .q-opt:hover .opt-num { background: #FF6A4D; border-color: #FF6A4D; color: white; }
  .opt-txt { font-size: 14px; color: rgba(255,255,255,0.88); line-height: 1.6; flex: 1; }

  /* ====== 加载页 ====== */
  #screen-loading { gap: 28px; text-align: center; }
  .load-ring {
    width: 70px; height: 70px; border-radius: 50%;
    border: 3px solid rgba(255,107,77,0.12);
    border-top-color: #FF6A4D;
    animation: spin 0.9s linear infinite;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .load-msg { font-size: 15px; color: rgba(255,255,255,0.35); animation: pulse 1.4s infinite; }

  /* ====== 结果页 ====== */
  #screen-result {
    padding: 24px 20px 60px;
    justify-content: flex-start; overflow-y: auto;
  }

  .res-emoji {
    font-size: 80px; margin: 8px 0 0;
    filter: drop-shadow(0 8px 24px rgba(255,107,77,0.3));
    animation: float 3s ease-in-out infinite;
  }
  .res-type-tag {
    font-size: 11px; color: rgba(255,255,255,0.3);
    letter-spacing: 4px; text-transform: uppercase; margin-bottom: 8px;
  }
  .res-type-name {
    font-size: clamp(24px, 7vw, 34px); font-weight: 900;
    background: linear-gradient(90deg, #FF6A4D, #FF3DAA, #9333EA);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center; line-height: 1.3; margin-bottom: 4px;
  }
  .res-type-en {
    font-size: 10px; color: #FF6A4D; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase; margin-bottom: 24px;
  }

  .res-card {
    width: 100%; max-width: 440px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 24px; padding: 22px 20px;
    display: flex; flex-direction: column; gap: 20px;
    backdrop-filter: blur(12px);
  }

  .res-block {}
  .res-block-title {
    font-size: 11px; color: #FF6A4D; font-weight: 900;
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .res-block-title::after { content: ''; flex: 1; height: 1px; background: rgba(255,107,77,0.2); }

  .res-main-desc {
    font-size: 15px; color: rgba(255,255,255,0.9);
    line-height: 2; font-weight: 400;
  }

  .res-analysis {
    font-size: 13px; color: rgba(255,255,255,0.5);
    line-height: 2; font-weight: 300;
    border-left: 3px solid rgba(255,107,77,0.4);
    padding-left: 14px;
  }

  .res-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .r-tag {
    padding: 5px 14px; border-radius: 50px;
    font-size: 12px; font-weight: 700;
    border: 1.5px solid; letter-spacing: 0.3px;
  }

  .res-funfact {
    background: rgba(251,191,36,0.07);
    border-left: 3px solid rgba(251,191,36,0.5);
    border-radius: 0 14px 14px 0;
    padding: 14px 16px;
    font-size: 13px; color: rgba(251,191,36,0.75);
    line-height: 1.9;
  }

  .res-meme {
    background: rgba(147,51,234,0.08);
    border: 1.5px dashed rgba(147,51,234,0.35);
    border-radius: 16px; padding: 16px;
    font-size: 13px; color: rgba(255,255,255,0.7);
    line-height: 2; text-align: center;
    white-space: pre-line;
  }

  .res-share-btn {
    width: 100%; max-width: 440px;
    background: linear-gradient(90deg, #FF6A4D, #FF3DAA);
    border: none; color: white; padding: 16px;
    border-radius: 60px; font-size: 16px; font-weight: 900;
    cursor: pointer; transition: all 0.3s;
    letter-spacing: 3px; text-transform: uppercase;
    box-shadow: 0 8px 28px rgba(255,107,77,0.4);
  }
  .res-share-btn:hover { transform: scale(1.04); box-shadow: 0 12px 36px rgba(255,107,77,0.6); }

  .res-retry-btn {
    background: transparent; border: 1.5px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.4);
    padding: 11px 30px; border-radius: 50px;
    font-size: 13px; cursor: pointer; transition: all 0.3s;
  }
  .res-retry-btn:hover { border-color: #FF6A4D; color: rgba(255,255,255,0.8); }

  .res-footer { font-size: 10px; color: rgba(255,255,255,0.13); text-align: center; letter-spacing: 1px; }

  /* color classes */
  .c-orange { color: #FF6A4D; border-color: rgba(255,106,77,0.4); background: rgba(255,106,77,0.1); }
  .c-pink { color: #FF3DAA; border-color: rgba(255,61,170,0.4); background: rgba(255,61,170,0.1); }
  .c-purple { color: #a855f7; border-color: rgba(147,51,234,0.4); background: rgba(147,51,234,0.1); }
  .c-yellow { color: #fbbf24; border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.08); }
  .c-cyan { color: #22d3ee; border-color: rgba(34,211,238,0.4); background: rgba(34,211,238,0.08); }
  .c-green { color: #4ade80; border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.08); }
</style>
</head>
<body>

<!-- 封面 -->
<div id="screen-start" class="screen active">
  <div class="bg-start"></div>
  <div style="display:flex;flex-direction:column;align-items:center;z-index:1;padding:32px 20px;text-align:center;">
    <div class="cover-top-badge">🧠 MBTI已经OUT了</div>
    <div class="cover-icon">🌙</div>
    <div class="cover-main-title">你是哪种<br>造梦人体质？</div>
    <div class="cover-sub-title">梦境人格测试</div>
    <div class="cover-divider"></div>
    <div class="cover-chips">
      <span class="chip c-orange">🦸 超雄战神</span>
      <span class="chip c-pink">🎭 人格分裂</span>
      <span class="chip c-purple">😱 社死专业户</span>
      <span class="chip c-yellow">💀 卡在高潮前</span>
      <span class="chip c-cyan">🛌 躺平摆烂</span>
      <span class="chip c-green">✨ 绝绝子</span>
    </div>
    <button class="cover-start-btn" onclick="startTest()">开始造梦 →</button>
    <div class="cover-note">20道题 · 2分钟 · 纯属娱乐</div>
  </div>
</div>

<!-- 问题页 -->
<div id="screen-question" class="screen">
  <div class="q-header">
    <div class="q-progress-wrap">
      <div class="q-progress-bg"><div class="q-progress-fill" id="progFill"></div></div>
      <div class="q-progress-label"><span id="progNum">1</span>/20</div>
    </div>
  </div>
  <div class="q-card">
    <div class="q-number">造梦第<span id="qNumDisp">一</span>题</div>
    <div class="q-text" id="qText"></div>
    <div class="q-hint" id="qHint"></div>
    <div class="q-options" id="qOpts"></div>
  </div>
</div>

<!-- 加载页 -->
<div id="screen-loading" class="screen">
  <div class="load-ring">💭</div>
  <div class="load-msg" id="loadMsg">正在分析你的梦境频率...</div>
</div>

<!-- 结果页 -->
<div id="screen-result" class="screen">
  <div class="res-emoji" id="rEmoji"></div>
  <div class="res-type-tag">你的造梦人格是</div>
  <div class="res-type-name" id="rName"></div>
  <div class="res-type-en" id="rEn"></div>

  <div class="res-card">
    <div class="res-block">
      <div class="res-block-title">🚩 你是什么情况</div>
      <div class="res-main-desc" id="rProfile"></div>
    </div>
    <div class="res-block">
      <div class="res-block-title">🔍 深度解析</div>
      <div class="res-analysis" id="rAnalysis"></div>
    </div>
    <div class="res-block">
      <div class="res-block-title">🏷️ 人格标签</div>
      <div class="res-tags" id="rTags"></div>
    </div>
    <div class="res-block">
      <div class="res-block-title">😂 搞笑真相</div>
      <div class="res-funfact" id="rFact"></div>
    </div>
    <div class="res-block">
      <div class="res-meme" id="rMeme"></div>
    </div>
  </div>

  <button class="res-share-btn" onclick="shareRes()">🚀 分享给朋友</button>
  <button class="res-retry-btn" onclick="restartTest()">重新测试 ↺</button>
  <div class="res-footer">画梦实验室出品 · 纯属娱乐</div>
</div>

<script>
// ===== 20道题目 =====
const Q = [
  {
    t: "你梦醒之后的第一反应通常是？",
    h: "真实的第一反应，不许装",
    o: [
      { s:{a:2,c:1,f:1,h:1,i:1}, txt: "赶紧回想，生怕忘了，梦里那个是谁来着" },
      { s:{b:2,e:1,g:1}, txt: "翻身继续睡，梦什么的不重要" }
    ]
  },
  {
    t: "你的梦一般是什么画质的？",
    h: "这个问题很重要",
    o: [
      { s:{a:1,c:2,d:1}, txt: "4K超清，连指甲盖都看得见" },
      { s:{b:1,e:1,f:1,h:1,i:1}, txt: "AV画质，模糊得跟打了马赛克一样" }
    ]
  },
  {
    t: "你经常做的梦是哪一种？",
    h: "你最逃不掉的那个",
    o: [
      { s:{a:2,f:1}, txt: "被人追 / 考试 / 迟到 / 裸奔 —— 经典噩梦全家桶" },
      { s:{c:2,e:1,g:1}, txt: "飞起来了 / 变形了 / 和偶像一起 —— 白日梦Plus" }
    ]
  },
  {
    t: "梦里有没有出现过你的小学/中学老师？",
    h: "特别是那种突然出现在奇怪地方的",
    o: [
      { s:{d:2,h:1}, txt: "出现过！TA还在梦里骂我" },
      { s:{b:1,e:1,i:1}, txt: "从来没有，TA不配出现在我的梦里" }
    ]
  },
  {
    t: "你有没有在梦里笑出声过？",
    h: "旁边有人看着你那种",
    o: [
      { s:{c:2,g:2}, txt: "有！把自己笑醒了那种" },
      { s:{a:1,b:1,d:1,f:1,h:1,i:1}, txt: "没有，梦里我的表情管理也在线" }
    ]
  },
  {
    t: "你有没有在梦里骂过人、打过人？",
    h: "或者做了现实中不敢做的事",
    o: [
      { s:{a:3}, txt: "有！梦里我是超雄战神，谁惹我我就干谁" },
      { s:{b:1,c:1,d:1,e:1,f:1,g:1,h:1,i:1}, txt: "没有，梦里我也是遵纪守法的好公民" }
    ]
  },
  {
    t: "你做的梦一般是什么结局？",
    h: "最常见的那种",
    o: [
      { s:{f:3,d:1}, txt: "被吓醒 / 卡住出不来 / 快追到了但梦结束了" },
      { s:{e:2,g:2,i:1}, txt: "自然醒 / 切换到另一个梦 / 睡着了（清醒梦）" }
    ]
  },
  {
    t: "你醒来之后会跟别人讲你的梦吗？",
    h: "别人听完的反应是？",
    o: [
      { s:{g:2}, txt: "会！我的梦很精彩，他们必须听" },
      { s:{b:2,a:1,h:1,i:1}, txt: "不会，讲了别人也不懂，还觉得我脑子有问题" }
    ]
  },
  {
    t: "你有没有过清醒梦？",
    h: "就是那种「等等我在做梦！」的时刻",
    o: [
      { s:{e:3}, txt: "有！而且我还能控制剧情走向" },
      { s:{a:1,b:1,c:1,d:1,f:1,g:1,h:1,i:1}, txt: "从来没有，我做梦比上班还认真" }
    ]
  },
  {
    t: "你梦里的自己，通常是什么状态？",
    h: "身体感受很重要",
    o: [
      { s:{a:2,f:2,d:1}, txt: "跑不动 / 说话没人听得见 / 无力反抗" },
      { s:{c:2,e:2,g:2}, txt: "生龙活虎 / 想干嘛就干嘛 / 甚至有超能力" }
    ]
  },
  {
    t: "你大概多久做一次能记住的梦？",
    h: "能被记住的那种",
    o: [
      { s:{g:2,a:1,c:1}, txt: "天天做，梦比我的生活还精彩" },
      { s:{b:2,i:2,f:1}, txt: "很少，感觉我睡觉就是纯关机模式" }
    ]
  },
  {
    t: "梦里出现过去世的亲人吗？",
    h: "这个问题有点私人",

const QUNITS = ["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"];
let cur = 0;
let SC = {};
const K = Object.keys(T);

function initSC() { SC = {}; K.forEach(k => SC[k]=0); }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startTest() { cur=0; initSC(); show('screen-question'); renderQ(); }

function renderQ() {
  const q = Q[cur];
  document.getElementById('progFill').style.width = (cur/Q.length*100)+'%';
  document.getElementById('progNum').textContent = cur+1;
  document.getElementById('qNumDisp').textContent = QUNITS[cur];
  document.getElementById('qText').textContent = q.t;
  document.getElementById('qHint').textContent = q.h;
  const oc = document.getElementById('qOpts');
  oc.innerHTML = '';
  q.o.forEach((o,i) => {
    const btn = document.createElement('div');
    btn.className = 'q-opt';
    btn.innerHTML = `<div class="opt-num">${i+1}</div><div class="opt-txt">${o.txt}</div>`;
    btn.onclick = () => pick(o.s);
    oc.appendChild(btn);
  });
}

function pick(s) {
  K.forEach(k => { if(s[k]) SC[k] += s[k]; });
  cur++;
  if (cur >= Q.length) { showLoading(); }
  else {
    const oc = document.getElementById('qOpts');
    oc.style.opacity='0'; oc.style.transform='translateY(8px)';
    setTimeout(()=>{ renderQ(); oc.style.transition='all 0.25s'; oc.style.opacity='1'; oc.style.transform='translateY(0)'; }, 110);
  }
}

    const s=document.createElement('span');
    s.className='r-tag '+t.tc[i%t.tc.length];
    s.textContent=tg;
    tgEl.appendChild(s);
  });
  show('screen-result');
}

function shareRes() {
  const k=topType(), t=T[k];
  const txt=`${t.n}\n\n${t.p}\n\n😂 ${t.m}\n\n🏷️ ${t.tg.join(' · ')}\n\n👉 你是哪种造梦人？测测看！`;
  if(navigator.share) navigator.share({title:'你是哪种造梦人？',text:txt});
  else navigator.clipboard.writeText(txt).then(()=>alert('结果已复制！快去发给朋友 😂'));
}

function restartTest() { startTest(); }
</script>
