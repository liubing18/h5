      --silver: #B8C4D0;
      --cream: #FAF8F5;
      --deep: #2C3E50;
      --accent: #7B68EE;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

        radial-gradient(ellipse at 70% 80%, rgba(123, 104, 238, 0.05) 0%, transparent 50%),

    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
      position: relative;
    }
    
    .logo::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--silver) 100%);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      animation: rotate 20s linear infinite;
    }
    
    .logo::after {
      content: '';
      position: absolute;
      inset: 10px;
      background: var(--cream);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: clamp(1.8rem, 6vw, 2.5rem);

      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }
    
    .subtitle {
      font-size: 0.9rem;
      color: var(--gold);
      margin-bottom: 3rem;
      letter-spacing: 0.2em;
    }
    
    .input-container {
      width: 100%;
      max-width: 320px;
      margin-bottom: 2rem;
    }
    
    .name-input {
      width: 100%;
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      font-family: 'Noto Serif SC', serif;
      border: 2px solid var(--gold-light);
      border-radius: 50px;
      background: white;
      color: var(--deep);
      text-align: center;
      transition: all 0.3s ease;
      outline: none;
    }
    
    .name-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(201, 169, 97, 0.15);
    }
    
    .name-input::placeholder {
      color: var(--silver);
    }
    
    .test-btn {
      padding: 1rem 3rem;
      font-size: 1.1rem;
      font-family: 'ZCOOL XiaoWei', serif;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      border: none;
      border-radius: 50px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.15em;
      box-shadow: 0 4px 15px rgba(201, 169, 97, 0.3);
    }
    
    .test-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 169, 97, 0.4);
    }
    
    .test-btn:active {
      transform: translateY(0);
    }
    
    .result-page {
      min-height: 100vh;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      background: var(--cream);

    .result-page.active {

    }
    
    .result-header {
      text-align: center;
      margin-bottom: 1rem;
    }
    
    .result-name {

      color: var(--silver);
      margin-bottom: 0.3rem;
    }
    
    .result-type {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: clamp(1.3rem, 5vw, 1.6rem);
      color: var(--deep);
      line-height: 1.4;
    }

      width: 100%;
      max-width: 320px;
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);

    .soul-shape-label {
      text-align: center;
      font-size: 0.85rem;
      color: var(--gold);
      margin-bottom: 0.8rem;
      letter-spacing: 0.1em;
    }
    
    .soul-visual {
      width: 200px;
      height: 200px;
      margin: 0 auto;
    }
    
    .soul-visual svg {

      height: 100%;

      font-size: 0.9rem;
      color: var(--deep);
      margin-top: 0.8rem;
      line-height: 1.5;

      padding-left: 1rem;

      left: 0;

      font-size: 0.75rem;
      color: var(--silver);
      margin-top: 1.5rem;
      padding-bottom: 1rem;
    }
  </style>
</head>

        const size = 0.8 + (i % 4) * 0.4;
        const opacity = 0.3 + (i % 3) * 0.2;
        svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size}" fill="hsl(${hue + i * 3}, 60%, 70%)" opacity="${opacity}"/>`;
      }
      
      // 核心亮区
      svg += `<circle cx="100" cy="100" r="20" fill="url(#soulGrad)" opacity="0.35" filter="url(#glow)"/>`;
      svg += `<circle cx="100" cy="100" r="8" fill="white" opacity="0.4"/>`;
      svg += `<circle cx="100" cy="100" r="3" fill="white" opacity="0.8"/>`;
      svg += `</svg>`;
      return svg;
    }
    
    // 生成波浪形状 - 用正弦叠加涌现水流
    function generateWave(energy, hue) {
      const waves = 5 + Math.floor((energy % 400) / 80);
      const iterations = 60;
      
      let svg = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="soulGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:hsl(${hue}, 55%, 60%);stop-opacity:1" />
            <stop offset="100%" style="stop-color:hsl(${hue + 30}, 45%, 50%);stop-opacity:1" />
          </linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <circle cx="100" cy="100" r="85" fill="url(#soulGrad)" opacity="0.06" filter="url(#glow)"/>`;
      
      // 多层正弦波叠加涌现水流感
      for (let w = 0; w < waves; w++) {
        svg += `<path d="`;
        const baseY = 70 + w * 15;
        const amplitude = 12 + w * 3;
        const freq = 2 + w * 0.4;
        
        for (let i = 0; i <= iterations; i++) {
          const x = 20 + (i / iterations) * 160;
          const y = baseY + Math.sin((i / iterations) * Math.PI * freq * 2 + w * 0.5) * amplitude
                         + Math.sin((i / iterations) * Math.PI * freq * 3.7) * amplitude * 0.3;
          if (i === 0) svg += `M${x.toFixed(1)},${y.toFixed(1)} `;
          else svg += `L${x.toFixed(1)},${y.toFixed(1)} `;
        }
        svg += `" fill="none" stroke="url(#soulGrad)" stroke-width="${1.2 - w * 0.15}" opacity="${0.2 + w * 0.08}" filter="url(#glow)"/>`;
      }
      
      // 核心水滴
      svg += `<circle cx="100" cy="100" r="12" fill="url(#soulGrad)" opacity="0.45" filter="url(#glow)"/>`;
      svg += `<circle cx="100" cy="100" r="6" fill="url(#soulGrad)" opacity="0.6" filter="url(#glow)"/>`;
      svg += `<circle cx="100" cy="100" r="3" fill="white"/>`;
      svg += `</svg>`;
      return svg;
    }
    
    // 计算汉字动能
    function getKineticEnergy(char) {
      const code = char.charCodeAt(0);
      if (code < 0x4E00 || code > 0x9FFF) {
        return Math.floor((code % 36000) + 1000);
      }
      const normalized = (code - 0x4E00) / (0x9FFF - 0x4E00);
      return Math.floor(1000 + normalized * 34000);
    }
    
    // 获取灵魂类型
    function getSoulType(energy) {
      const index = Math.min(Math.floor((energy - 1000) / 1000), soulTypes.length - 1);
      return soulTypes[index];
    }
    
    // 获取灵魂形状
    function getSoulShape(energy) {
      const index = Math.floor((energy % (soulShapes.length * 1000)) / 1000);
      return soulShapes[index % soulShapes.length];
    }
    
    // 生成结果
    function generateResult(name) {
      const chars = name.split('');
      const energies = chars.map(getKineticEnergy);
      const avgEnergy = Math.floor(energies.reduce((a, b) => a + b, 0) / energies.length);
      
      return {
        energy: avgEnergy,
        soulType: getSoulType(avgEnergy),
        soulShape: getSoulShape(avgEnergy),
        charEnergies: energies
      };
    }
    
    // 开始测试
    function startTest() {
      const nameInput = document.getElementById('nameInput');
      const name = nameInput.value.trim();
      
      if (!name) {
        nameInput.style.borderColor = '#E74C3C';
        setTimeout(() => { nameInput.style.borderColor = ''; }, 1000);
        return;
      }
      
      const result = generateResult(name);
      const soul = result.soulType;
      const shape = result.soulShape;
      const hue = (result.energy / 36000) * 60 + 30;
      
      document.getElementById('homePage').classList.add('hidden');
      document.getElementById('resultPage').classList.add('active');
      
      document.getElementById('resultName').textContent = '「' + name + '」';
      document.getElementById('resultType').textContent = soul.name;
      
      // 灵魂可视化
      document.getElementById('soulVisual').innerHTML = shape.generate(result.energy, hue);
      document.getElementById('soulShapeDesc').textContent = shape.name + ' · ' + shape.desc;
      
      // 灵魂说明书
      document.getElementById('soulManual').innerHTML = `
        <div class="card-title">📝 灵魂说明书</div>
        <ul class="card-list">
          ${soul.manual.map(item => `<li>${item}</li>`).join('')}
        </ul>
      `;
      
      // 朋友吐槽
      document.getElementById('friendComment').innerHTML = `
        <div class="comment-label">💬 朋友眼里的你</div>
        <div class="comment-text">"${soul.friendSays}"</div>
      `;
      
      // 灵魂CP
      document.getElementById('soulCp').innerHTML = `
        <div class="cp-header">
          <span class="cp-icon">💕</span>
          <span class="cp-title">你的灵魂CP</span>
        </div>
        <div class="cp-type">${soul.cpType}</div>
        <div class="cp-reasons">${soul.cpReason.replace(/\n/g, '<br>')}</div>
      `;
    }
    
    function shareResult() {
      const name = document.getElementById('resultName').textContent;
      const type = document.getElementById('resultType').textContent;
      const shapeDesc = document.getElementById('soulShapeDesc').textContent;
      
      const shareText = `我是${type}！\n我的灵魂是「${shapeDesc.split('·')[0].trim()}」\n\n快来测测你的灵魂长什么样！`;
      
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText);
      }
      
      const toast = document.getElementById('shareToast');
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }
    
    function goHome() {
      document.getElementById('resultPage').classList.remove('active');
      document.getElementById('homePage').classList.remove('hidden');
      document.getElementById('nameInput').value = '';
    }
    
    document.getElementById('nameInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') startTest();
    });
  </script>
</body>
</html>
